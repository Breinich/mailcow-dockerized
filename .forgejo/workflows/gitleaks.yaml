name: Secret Scanning
on: [push, pull_request]

jobs:
  scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Important: scans entire history

      - name: Run Gitleaks
        run: gitleaks detect --source /workspace --verbose --redact
