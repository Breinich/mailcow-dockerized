name: Secret Scanning
on: [push, pull_request]

jobs:
  scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # This runs the specific step inside the container, 
        # while 'checkout' runs on the host runner.
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source /github/workspace --verbose --redact