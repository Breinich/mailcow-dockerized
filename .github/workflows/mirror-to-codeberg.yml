name: Mirror main to Codeberg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeberg-mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          auth=$(printf 'breinich:%s' "$CODEBERG_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: Basic $auth" \
            push https://codeberg.org/bajnok-lab/email.git HEAD:main
