name: Mirror main to Codeberg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeberg-mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          auth=$(printf 'breinich:%s' "$CODEBERG_TOKEN" | base64 | tr -d '\n')
          remote=https://codeberg.org/bajnok-lab/email.git
          git -c http.extraheader="Authorization: Basic $auth" \
            fetch "$remote" +refs/heads/main:refs/remotes/codeberg/main
          remote_main=$(git rev-parse refs/remotes/codeberg/main)
          git -c http.extraheader="Authorization: Basic $auth" \
            push --force-with-lease="refs/heads/main:$remote_main" \
            "$remote" HEAD:main
